name: Meta reviewer checks
on:
  pull_request:
  push:
    branches: [main, meta-contractor-reviewer-v1]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run type-check
      - run: npm test
      - run: npm run build:check
