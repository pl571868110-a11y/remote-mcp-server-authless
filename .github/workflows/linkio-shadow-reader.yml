name: LINKIO Shadow Reader isolated checks
on:
  pull_request:
    paths:
      - 'workers/linkio-shadow-reader-v1/**'
      - 'workers/linkio-shadow-smoke-v1/**'
      - '.github/workflows/linkio-shadow-reader.yml'
  workflow_dispatch:
jobs:
  unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify read-only evidence parsing
        working-directory: workers/linkio-shadow-reader-v1
        run: node --test tests/*.test.mjs
      - name: Smoke Workflow syntax
        run: node --check workers/linkio-shadow-smoke-v1/src/index.mjs
