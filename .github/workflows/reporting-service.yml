name: Reporting service release checks
on:
  pull_request:
    paths: ['reporting-service/**', 'scripts/check-reporting-bundle.py', 'tests/reporting_deploy_test.py', '.github/workflows/reporting-service.yml']
  push:
    branches: [main]
    paths: ['reporting-service/**', 'scripts/check-reporting-bundle.py', 'tests/reporting_deploy_test.py', '.github/workflows/reporting-service.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - run: node --test reporting-service/isolation.test.mjs
      - run: python3 scripts/check-reporting-bundle.py
      - run: python3 -m unittest discover -s tests -p reporting_deploy_test.py

