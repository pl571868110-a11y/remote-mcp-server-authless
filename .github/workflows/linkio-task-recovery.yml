name: LINKIO Task Recovery isolated checks
on:
  pull_request:
    paths:
      - 'workers/linkio-task-recovery-v1/**'
      - '.github/workflows/linkio-task-recovery.yml'
  workflow_dispatch:
jobs:
  deterministic-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Isolated unit tests
        working-directory: workers/linkio-task-recovery-v1
        run: node --test tests/classifier.test.mjs
      - name: Install local Workers runtime
        working-directory: workers/linkio-task-recovery-v1
        run: npm install --no-save --no-audit --no-fund miniflare@4
      - name: Isolated synthetic RPC tests
        working-directory: workers/linkio-task-recovery-v1
        run: node --test tests/rpc.test.mjs
