name: LINKIO Task Recovery isolated checks
on:
  pull_request:
    paths:
      - 'workers/linkio-task-recovery-v1/**'
      - '.github/workflows/linkio-task-recovery.yml'
  workflow_dispatch:
jobs:
  deterministic-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run isolated tests
        working-directory: workers/linkio-task-recovery-v1
        run: node --test tests/*.test.mjs
