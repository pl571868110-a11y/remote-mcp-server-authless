name: LINKIO Quality Gate isolated checks
on:
  pull_request:
    paths:
      - 'workers/linkio-quality-gate-v1/**'
      - '.github/workflows/linkio-quality-gate.yml'
  workflow_dispatch:
jobs:
  deterministic-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests
        working-directory: workers/linkio-quality-gate-v1
        run: node --test tests/evaluator.test.mjs
      - name: Install isolated Workers runtime
        working-directory: workers/linkio-quality-gate-v1
        run: npm install --no-save --no-audit --no-fund miniflare@4
      - name: Synthetic RPC through Service Binding
        working-directory: workers/linkio-quality-gate-v1
        run: node --test tests/rpc.test.mjs
